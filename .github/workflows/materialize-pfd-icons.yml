name: materialize-pfd-icons

# One-shot: decode ASCII base64 staging into real PNG/ICO/ICNS on feat/app-icon.
# GitHub MCP push_files cannot upload binary blobs without UTF-8 corruption.
on:
  push:
    branches: [feat/app-icon]
    paths:
      - "assets/.icon-staging/**"
      - ".github/workflows/materialize-pfd-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/app-icon
        uses: actions/checkout@v4
        with:
          ref: feat/app-icon

      - name: Decode staging base64 into assets/
        run: |
          set -euo pipefail
          if [[ ! -f assets/.icon-staging/manifest.json ]]; then
            echo "Staging already removed — nothing to do."
            exit 0
          fi
          python3 assets/.icon-staging/decode.py

      - name: Commit binaries and remove staging + this workflow
        run: |
          set -euo pipefail
          if [[ ! -f assets/.icon-staging/manifest.json ]]; then
            echo "Already materialized or staging missing"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pfd-source.png assets/pfd-icon.png assets/pfd.png assets/pfd.ico assets/pfd.icns assets/linux
          git rm -r --ignore-unmatch assets/.icon-staging
          git rm --ignore-unmatch .github/workflows/materialize-pfd-icons.yml
          git rm --ignore-unmatch assets/_probe_tiny.png assets/_probe_tiny2.png || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: materialize PFD app icon binaries (png/ico/icns)"
          git push origin HEAD:feat/app-icon
