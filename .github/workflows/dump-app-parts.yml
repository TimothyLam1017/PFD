name: dump-app-parts
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-tweaks-1-4
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Split app.rs and commit parts
        run: |
          set -euo pipefail
          mkdir -p .scratch/app-parts
          # ~12KB chunks so MCP get_file_contents can return each fully
          split -b 12000 -d -a 2 src/app.rs .scratch/app-parts/part_
          ls -la .scratch/app-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scratch/app-parts
          git commit -m "chore: scratch app.rs parts for agent (temporary)" || echo "nothing to commit"
          git push origin HEAD:ux-tweaks-1-4
